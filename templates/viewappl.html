</head>
<body>

            <th style="color: aliceblue;">Request ID</th>
            <th style="color: aliceblue;">Job ID</th>

            <th style="color: aliceblue;">Date</th>
            <th style="color: aliceblue;">Status</th>

        {% for i in data['view'] %}

            <td>{{i['request_id']}}</td>
            <td>{{i['job_id']}}</td>
            <td>{{i['user_id']}}</td>
            <td>{{i['cv_file']}}</td>
            <td>{{i['date']}}</td>
            <td>{{i['status']}}</td>
        </tr>
        {% endfor %}
    </center>  
    </table><br><br><br><br><br><br><br><br><br><br><br><br><br>
</body>
</html>
